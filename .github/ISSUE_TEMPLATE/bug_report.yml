name: Bug report
description: Something does not work the way it should
labels: [bug]

body:
  - type: dropdown
    id: package
    attributes:
      label: Package
      options:
        - react-use-notifications
        - react-use-notifications-ui
        - not sure
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      placeholder: 0.1.0
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: React version and browser
      placeholder: React 19.0.0, Chrome 131 on macOS
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you expected, and what you got instead.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: >
        A link to a minimal repo or sandbox, or the smallest snippet that shows it. Notifications
        need HTTPS or localhost, and action buttons need a service worker, so mention how you
        served the page.
    validations:
      required: true

  - type: textarea
    id: outcome
    attributes:
      label: show() result
      description: If show() is involved, paste the resolved result object.
      render: json
