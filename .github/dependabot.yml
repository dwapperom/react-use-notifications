version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: development
    ignore:
      # Majors here are deliberate migrations, not weekly chores. Patches and minors still come
      # through. vitest and its coverage provider have to move together, so neither goes alone.
      - dependency-name: vitest
        update-types:
          - version-update:semver-major
      - dependency-name: "@vitest/coverage-v8"
        update-types:
          - version-update:semver-major
      # TypeScript 7 is the Go rewrite and tsup 8 cannot build types with it:
      # "Cannot read properties of undefined (reading 'useCaseSensitiveFileNames')".
      - dependency-name: typescript
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
